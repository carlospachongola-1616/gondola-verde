<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góndola Verde | Inventario de productos veganos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Encabezado ===== -->
  <header class="encabezado">
    <div class="logo">🌱 Góndola Verde</div>
    <p class="subtitulo">Inventario de productos veganos del supermercado</p>
  </header>

  <main class="contenedor">

    <!-- ===== Formulario: CREAR y ACTUALIZAR ===== -->
    <section class="tarjeta">
      <h2 id="tituloFormulario">Agregar producto</h2>

      <form id="formProducto" novalidate>
        <!-- Campo oculto: guarda el id cuando estamos editando -->
        <input type="hidden" id="productoId">

        <div class="grupo">
          <label for="nombre">Nombre del producto *</label>
          <input type="text" id="nombre" placeholder="Ej: Leche de almendras" required>
        </div>

        <div class="grupo">
          <label for="marca">Marca *</label>
          <input type="text" id="marca" placeholder="Ej: Naturela" required>
        </div>

        <div class="grupo">
          <label for="categoria">Categoría *</label>
          <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option>Lácteos vegetales</option>
            <option>Proteínas vegetales</option>
            <option>Snacks</option>
            <option>Panadería</option>
            <option>Granos y cereales</option>
            <option>Aseo y cuidado personal</option>
          </select>
        </div>

        <div class="fila">
          <div class="grupo">
            <label for="precio">Precio (COP) *</label>
            <input type="number" id="precio" min="0" step="50" placeholder="Ej: 12500" required>
          </div>
          <div class="grupo">
            <label for="stock">Stock *</label>
            <input type="number" id="stock" min="0" step="1" placeholder="Ej: 20" required>
          </div>
        </div>

        <div class="grupo">
          <label for="vencimiento">Fecha de vencimiento</label>
          <input type="date" id="vencimiento">
        </div>

        <label class="check">
          <input type="checkbox" id="certificado">
          Tiene sello de certificación vegana
        </label>

        <p id="mensajeError" class="error" aria-live="polite"></p>

        <div class="botones">
          <button type="submit" id="btnGuardar" class="btn btn-primario">Guardar producto</button>
          <button type="button" id="btnCancelar" class="btn btn-secundario oculto">Cancelar edición</button>
        </div>
      </form>
    </section>

    <!-- ===== Lista de productos: LEER y ELIMINAR ===== -->
    <section class="tarjeta">
      <div class="cabecera-lista">
        <h2>Productos registrados <span id="contador" class="contador">0</span></h2>
        <div class="filtros">
          <input type="search" id="buscador" placeholder="Buscar por nombre o marca...">
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
            <option>Lácteos vegetales</option>
            <option>Proteínas vegetales</option>
            <option>Snacks</option>
            <option>Panadería</option>
            <option>Granos y cereales</option>
            <option>Aseo y cuidado personal</option>
          </select>
        </div>
      </div>

      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Vence</th>
              <th>Sello</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
      <p id="vacio" class="vacio oculto">No hay productos para mostrar. 🥕</p>
    </section>

  </main>

  <footer class="pie">Proyecto CRUD desarrollado con IA · Seminario Gestión de Software Ágil asistido por IA · FET</footer>

  <!-- Aviso flotante (toast) -->
  <div id="aviso" class="aviso"></div>

  <script src="js/app.js"></script>
</body>
</html>
